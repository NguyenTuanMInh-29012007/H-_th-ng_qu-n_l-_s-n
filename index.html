<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống đặt sân thể thao nội bộ</title>
<style>
:root{--bg:#f3f7f4;--cd:#fff;--tx:#16241d;--mu:#60726a;--bd:#d9e4de;--pr:#12805c;--pt:#fff;--ok:#d6f1e2;--okt:#0b5a3e;--wa:#fff0bf;--wat:#765200;--er:#fde0e0;--ert:#9b1c1c;--gr:#e4e8e6;--grt:#56625c;--inf:#dbe9fb;--inft:#1d4f91;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1713;--cd:#17221c;--tx:#e6f0ea;--mu:#93a79c;--bd:#2a3b32;--pr:#2fb386;--pt:#06231a;--ok:#12392a;--okt:#8fe3bc;--wa:#47390c;--wat:#f3d777;--er:#471b1b;--ert:#f5a3a3;--gr:#2a342f;--grt:#a9b8af;--inf:#16304f;--inft:#9cc4f5;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1713;--cd:#17221c;--tx:#e6f0ea;--mu:#93a79c;--bd:#2a3b32;--pr:#2fb386;--pt:#06231a;--ok:#12392a;--okt:#8fe3bc;--wa:#47390c;--wat:#f3d777;--er:#471b1b;--ert:#f5a3a3;--gr:#2a342f;--grt:#a9b8af;--inf:#16304f;--inft:#9cc4f5;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif}
header{background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:700;color:var(--pr);font-size:17px;white-space:nowrap}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ok);color:var(--okt);font-weight:600}
.ur{display:flex;align-items:center;gap:8px;font-size:14px}.ur small{color:var(--mu)}
main{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
h2{margin:0 0 14px;font-size:21px}h3{margin:0 0 10px;font-size:16px}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.d{background:var(--er);color:var(--ert)}.btn.s{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar input,.bar select{width:auto;min-width:160px}
.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;overflow:hidden}.pad{padding:16px}
.art{height:120px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,#1b9a6f,#0c5e48)}
.cd p{margin:4px 0;color:var(--mu);font-size:14px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.ok{background:var(--ok);color:var(--okt)}.wa{background:var(--wa);color:var(--wat)}.er{background:var(--er);color:var(--ert)}.gr{background:var(--gr);color:var(--grt)}.inf{background:var(--inf);color:var(--inft)}
.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}.days .chip{border-radius:10px;text-align:center;line-height:1.3;min-width:70px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sl{border:1.5px solid transparent;border-radius:10px;padding:10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:inherit}
.sl small{font-size:12.5px}.sl.free{background:var(--ok);color:var(--okt)}.sl.free:hover{border-color:var(--pr)}.sl.pend{background:var(--wa);color:var(--wat)}.sl.busy{background:var(--er);color:var(--ert)}.sl.maint,.sl.past{background:var(--gr);color:var(--grt)}.sl.mine{border-color:currentColor}.sl:disabled{cursor:not-allowed}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;font-size:13px;color:var(--mu)}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}td.w{white-space:normal;min-width:160px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kp .cd{padding:14px}.kp b{font-size:26px;display:block}.kp span{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.br{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}.br span:first-child{width:130px;flex:none}.br div{flex:1;background:var(--gr);border-radius:6px;height:16px}.br div i{display:block;height:100%;background:var(--pr);border-radius:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.md{background:var(--cd);border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.md .ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.err{color:var(--ert);font-size:13.5px;margin-top:8px;min-height:18px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30;display:none;font-size:14px}
.lo{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0c5e48,#1b9a6f)}.lo .cd{width:100%;max-width:400px;padding:26px}
.hint{font-size:13px;color:var(--mu);margin-top:14px}.hint button{margin:4px 4px 0 0}.mu{color:var(--mu)}.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const NOW=()=>new Date(),T0=()=>{const d=NOW();d.setHours(0,0,0,0);return d};
const dayAdd=n=>{const d=T0();d.setDate(d.getDate()+n);return fmt(d)};
const vd=s=>{const[y,m,d]=s.split('-');return d+'/'+m+'/'+y},WD=['CN','T2','T3','T4','T5','T6','T7'];
const ST={PENDING:['Chờ xác nhận','wa'],CONFIRMED:['Đã xác nhận','ok'],REJECTED:['Từ chối','er'],CANCELLED:['Đã hủy','gr'],COMPLETED:['Hoàn thành','inf'],NO_SHOW:['Vắng mặt','er']};
const act=b=>b.status=='PENDING'||b.status=='CONFIRMED',badge=s=>`<span class="bd ${ST[s][1]}">${ST[s][0]}</span>`;
let DB,S={u:null,view:'',t:0,q:'',court:0,date:dayAdd(0),pg:1,tab:'wait',reg:0};
const K='dat_san_v1',save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const slotO=id=>DB.slots.find(s=>s.id==id),courtO=id=>DB.courts.find(c=>c.id==id),userO=id=>DB.users.find(u=>u.id==id),sportO=id=>DB.sports.find(s=>s.id==id);
const stAt=b=>new Date(b.date+'T'+slotO(b.slot).s+':00');

function seed(){
 let r=7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;
 const D={cfg:{adv:7,day:2,max:5,cancelH:2,miss:3},nid:5000,nt:[],maint:[],bk:[],slots:[],
  sports:['Cầu lông|🏸','Bóng đá mini|⚽','Bóng rổ|🏀','Bóng chuyền|🏐','Tennis|🎾','Bóng bàn|🏓'].map((x,i)=>({id:i+1,name:x.split('|')[0],icon:x.split('|')[1],on:1})),
  courts:[[1,'Sân cầu lông A1','Nhà thể thao đa năng, tầng 1',8],[1,'Sân cầu lông A2','Nhà thể thao đa năng, tầng 1',8],[2,'Sân bóng đá mini B1','Khu thể thao ngoài trời',14],[3,'Sân bóng rổ C1','Nhà thi đấu số 2',10],[4,'Sân bóng chuyền D1','Nhà thi đấu số 2',12],[5,'Sân tennis E1','Khu thể thao ngoài trời',4],[6,'Phòng bóng bàn F1','Nhà thể thao đa năng, tầng 2',6]].map((c,i)=>({id:i+1,sport:c[0],name:c[1],loc:c[2],cap:c[3],on:1})),
  users:[[1,'admin@example.edu.vn','Admin@12345','Quản trị viên','QTV001','0900000001','ADMIN'],[2,'user01@example.edu.vn','User@12345','Trần Văn An','B25DT001','0900000002','USER'],[3,'lehoangnam@example.edu.vn','User@12345','Lê Hoàng Nam','B25DT002','0900000003','USER'],[4,'phamthuha@example.edu.vn','User@12345','Phạm Thu Hà','B25DT003','0900000004','USER'],[5,'vuquanghuy@example.edu.vn','User@12345','Vũ Quang Huy','B25DT004','0900000005','USER']].map(u=>({id:u[0],email:u[1],pw:u[2],name:u[3],code:u[4],phone:u[5],role:u[6],locked:0,until:''}))};
 for(let h=6;h<22;h++)D.slots.push({id:h-5,s:pad(h)+':00',e:pad(h+1)+':00',on:1});
 D.maint.push({id:1,court:6,date:dayAdd(3),slot:0,reason:'Bảo dưỡng mặt sân'});
 const add=(user,court,slot,off,purpose,n,status,reason)=>{const date=dayAdd(off);
  if(D.bk.some(b=>b.court==court&&b.date==date&&b.slot==slot)||D.maint.some(m=>m.court==court&&m.date==date))return;
  D.bk.push({id:D.bk.length+1,user,court,slot,date,purpose,n,status,reason:reason||'',created:Date.now()-36e5*(status=='PENDING'?1+rnd()*5:48)})};
 [[2,1,14,-1,'Tập luyện CLB cầu lông',6,'COMPLETED'],[2,4,12,-2,'Giao hữu giữa các khoa',10,'COMPLETED'],[2,6,5,-3,'Luyện tập tennis',2,'NO_SHOW'],[2,3,15,-4,'Đá giao hữu',10,'CANCELLED','Thay đổi kế hoạch'],[2,5,13,-5,'Sinh hoạt CLB bóng chuyền',12,'REJECTED','Trùng lịch sự kiện của nhà trường'],
  [2,1,14,1,'Tập luyện CLB cầu lông',6,'PENDING'],[2,1,15,2,'Thi đấu giao hữu',4,'CONFIRMED'],[2,5,13,3,'Sinh hoạt CLB bóng chuyền',12,'CONFIRMED'],
  [3,1,10,0,'Chơi giải trí',4,'CONFIRMED'],[4,1,11,0,'Chơi giải trí',4,'PENDING'],[3,1,12,1,'Tập luyện',4,'CONFIRMED'],[4,1,13,1,'Tập luyện',4,'CONFIRMED'],
  [3,4,3,0,'Tập luyện bóng rổ',8,'CONFIRMED'],[4,5,4,0,'Giao hữu bóng chuyền',10,'CONFIRMED'],[3,3,12,0,'Đá giao hữu',10,'CONFIRMED'],[5,7,2,0,'Chơi bóng bàn',4,'COMPLETED'],
  [3,3,14,1,'Đá giao hữu khoa CNTT',12,'PENDING'],[4,4,15,2,'Tập luyện đội tuyển',8,'PENDING'],[5,7,11,1,'Chơi bóng bàn giải trí',4,'PENDING'],[5,6,13,2,'Luyện tập tennis',2,'PENDING']].forEach(x=>add(...x));
 const P=['Tập luyện CLB','Giao hữu giữa các lớp','Chơi giải trí','Luyện tập đội tuyển','Sinh hoạt nhóm'];
 for(let i=0;i<1100;i++){const off=Math.floor(rnd()*37)-30;if(off==0)continue;const court=1+Math.floor(rnd()*7),h=rnd()<.6?17+Math.floor(rnd()*4):6+Math.floor(rnd()*16),x=rnd();
  const status=off<0?(x<.74?'COMPLETED':x<.82?'NO_SHOW':'CANCELLED'):(x<.7?'CONFIRMED':'PENDING');
  add(3+Math.floor(rnd()*3),court,h-5,off,P[Math.floor(rnd()*5)],1+Math.floor(rnd()*D.courts[court-1].cap),status,status=='CANCELLED'?'Đổi kế hoạch':'')}
 D.bk.forEach((b,i)=>b.id=i+1);
 D.nt.push({id:1,u:2,t:'Lượt đặt Sân cầu lông A1 ngày '+vd(dayAdd(2))+' đã được xác nhận.',read:0,at:Date.now()-36e5},{id:2,u:2,t:'Yêu cầu đặt Sân bóng chuyền D1 ngày '+vd(dayAdd(-5))+' bị từ chối: Trùng lịch sự kiện của nhà trường.',read:1,at:Date.now()-5*864e5});
 return D}
try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!DB)DB=seed();

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
const M=h=>$('#modal').innerHTML=h?`<div class=ov><div class=md>${h}</div></div>`:'';
const notify=(u,t)=>{DB.nt.push({id:DB.nid++,u,t,read:0,at:Date.now()})};
const nm=b=>courtO(b.court).name+' ('+slotO(b.slot).s+'–'+slotO(b.slot).e+', '+vd(b.date)+')';

function ss(c,date,s){
 if(DB.maint.some(m=>m.court==c&&m.date==date&&(!m.slot||m.slot==s.id)))return{k:'maint'};
 const b=DB.bk.find(b=>b.court==c&&b.date==date&&b.slot==s.id&&act(b));
 if(b)return{k:b.status=='PENDING'?'pend':'busy',b};
 return{k:new Date(date+'T'+s.s+':00')<=NOW()?'past':'free'}}
function sweep(){let ch=0;DB.bk.forEach(b=>{if(b.status=='PENDING'&&(NOW()-b.created>12*36e5||stAt(b)-NOW()<36e5)){b.status='CANCELLED';b.reason='Hệ thống tự hủy do quá hạn xác nhận';notify(b.user,'Lượt đặt '+nm(b)+' đã bị hệ thống tự hủy do quá hạn xác nhận.');ch=1}});if(ch)save()}

function book(court,date,s,purpose,n){const u=S.u,c=courtO(court),cf=DB.cfg;
 if(u.until&&new Date(u.until)>NOW())return'Tài khoản đang bị khóa đặt sân đến '+vd(u.until.slice(0,10));
 if(new Date(date+'T'+s.s+':00')<=NOW())return'Khung giờ này đã qua.';
 if(Math.round((new Date(date+'T00:00:00')-T0())/864e5)>cf.adv)return'Chỉ được đặt trước tối đa '+cf.adv+' ngày.';
 const mine=DB.bk.filter(b=>b.user==u.id&&act(b));
 if(mine.length>=cf.max)return'Vượt hạn mức '+cf.max+' lượt đang hiệu lực cùng lúc.';
 if(mine.filter(b=>b.date==date).length>=cf.day)return'Mỗi ngày chỉ được đặt tối đa '+cf.day+' khung giờ.';
 if(!purpose.trim())return'Vui lòng nhập mục đích sử dụng.';
 if(!(n>=1&&n<=c.cap))return'Số người tham gia phải từ 1 đến '+c.cap+' (sức chứa của sân).';
 if(ss(court,date,s).k!='free')return'Khung giờ đã được đặt hoặc đang bảo trì. Vui lòng chọn khung giờ khác.';
 DB.bk.push({id:DB.nid++,user:u.id,court,slot:s.id,date,purpose:purpose.trim(),n,status:'PENDING',reason:'',created:Date.now()});
 DB.users.filter(x=>x.role=='ADMIN').forEach(a=>notify(a.id,u.name+' vừa gửi yêu cầu đặt '+courtO(court).name+' lúc '+s.s+' ngày '+vd(date)+'.'));save()}
function cancel(id,reason,adm){const b=DB.bk.find(b=>b.id==id);if(!reason.trim())return'Bắt buộc nhập lý do hủy.';
 if(!adm&&stAt(b)-NOW()<DB.cfg.cancelH*36e5)return'Chỉ được hủy trước giờ bắt đầu ít nhất '+DB.cfg.cancelH+' giờ.';
 b.status='CANCELLED';b.reason=reason.trim();
 if(adm)notify(b.user,'Lượt đặt '+nm(b)+' đã bị quản trị viên hủy: '+b.reason);else DB.users.filter(x=>x.role=='ADMIN').forEach(a=>notify(a.id,S.u.name+' đã hủy lượt đặt '+nm(b)+'.'));save()}

const chip=(t,l,on,a)=>`<button class="chip ${on?'on':''}" data-a="${a}" data-v="${t}">${l}</button>`;
const tbl=(h,rows)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows||`<tr><td colspan=${h.length} class=mu>Không có dữ liệu.</td></tr>`}</table></div>`;
function pager(n){const p=Math.max(1,Math.ceil(n/10));if(S.pg>p)S.pg=p;return`<div class=pg><span>Trang ${S.pg}/${p} · ${n} bản ghi</span><button class="btn o s" data-a=pg data-v=-1 ${S.pg<=1?'disabled':''}>‹ Trước</button><button class="btn o s" data-a=pg data-v=1 ${S.pg>=p?'disabled':''}>Sau ›</button></div>`}
const pg=a=>a.slice((S.pg-1)*10,S.pg*10);
const sel=(id,opts,v)=>`<select id=${id}>${opts.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select>`;

function courtCards(){const q=S.q.toLowerCase();
 const l=DB.courts.filter(c=>c.on&&sportO(c.sport).on&&(!S.t||c.sport==S.t)&&c.name.toLowerCase().includes(q));
 return l.map(c=>{const sp=sportO(c.sport);return`<div class=cd><div class=art>${sp.icon}</div><div class=pad><h3>${esc(c.name)}</h3><span class="bd inf">${sp.name}</span><p>📍 ${esc(c.loc)}</p><p>👥 Sức chứa tối đa ${c.cap} người</p><button class=btn style="margin-top:10px;width:100%" data-a=open data-v=${c.id}>Xem khung giờ &amp; đặt sân</button></div></div>`}).join('')||'<p class=mu>Không tìm thấy sân phù hợp.</p>'}

const V={
courts:()=>`<h2>Danh sách sân</h2><div class=bar><div style="display:flex;gap:6px;flex-wrap:wrap">${chip(0,'Tất cả',!S.t,'type')+DB.sports.filter(s=>s.on).map(s=>chip(s.id,s.icon+' '+s.name,S.t==s.id,'type')).join('')}</div><input id=q placeholder="Tìm theo tên sân…" value="${esc(S.q)}"></div><div id=cl class=cards>${courtCards()}</div>`,
grid:()=>{const c=courtO(S.court),sp=sportO(c.sport);
 const days=[...Array(DB.cfg.adv)].map((_,i)=>dayAdd(i));
 const cells=DB.slots.filter(s=>s.on).map(s=>{const x=ss(c.id,S.date,s),mine=x.b&&x.b.user==S.u.id;
  const lb={free:'Trống',pend:'Chờ xác nhận',busy:'Đã đặt',maint:'Bảo trì',past:'Đã qua'}[x.k]+(mine?' · của bạn':'');
  return`<button class="sl ${x.k} ${mine?'mine':''}" ${x.k=='free'?`data-a=pick data-v=${s.id}`:'disabled'}><b>${s.s}–${s.e}</b><small>${lb}</small></button>`}).join('');
 return`<button class="btn o s" data-a=nav data-v=courts>‹ Danh sách sân</button><h2 style="margin-top:12px">${sp.icon} ${esc(c.name)}</h2><p class=mu style="margin-top:-8px">📍 ${esc(c.loc)} · 👥 Tối đa ${c.cap} người</p>
 <div class=days>${days.map(d=>{const x=new Date(d+'T00:00:00');return`<button class="chip ${d==S.date?'on':''}" data-a=day data-v=${d}><b>${WD[x.getDay()]}</b><br>${pad(x.getDate())}/${pad(x.getMonth()+1)}</button>`}).join('')}</div>

 dc:v=>{const e=cancel(v,$('#rs').value,S.u.role=='ADMIN');if(e)return $('#me').textContent=e;M('');render();toast('Đã hủy lượt đặt, khung giờ được giải phóng.')},
 fb:v=>M(`<h3>Đánh giá sân</h3><label>Số sao</label>${sel('fr',[5,4,3,2,1].map(n=>[n,'⭐'.repeat(n)]))}<label>Nội dung (10–500 ký tự)</label><textarea id=ft2 rows=3></textarea><div class=err id=me></div><div class=ac><button class="btn o" data-a=x>Đóng</button><button class=btn data-a=sfb data-v=${v}>Gửi</button></div>`),
 sfb:v=>{const t=$('#ft2').value.trim();if(t.length<10||t.length>500)return $('#me').textContent='Nội dung phải từ 10 đến 500 ký tự.';DB.bk.find(b=>b.id==v).fb={r:+$('#fr').value,t};save();M('');render();toast('Cảm ơn bạn đã phản hồi.')},
 bell:()=>{const l=DB.nt.filter(n=>n.u==S.u.id).sort((a,b)=>b.at-a.at).slice(0,12);M(`<h3>Thông báo</h3>${l.map(n=>`<p style="margin:8px 0;${n.read?'color:var(--mu)':'font-weight:600'}">${esc(n.t)}<br><small class=mu>${new Date(n.at).toLocaleString('vi-VN')}</small></p>`).join('')||'<p class=mu>Chưa có thông báo.</p>'}<div class=ac><button class=btn data-a=x>Đóng</button></div>`);l.forEach(n=>n.read=1);save();render()},
 ok:v=>{const b=DB.bk.find(b=>b.id==v);if(b.status!='PENDING')return toast('Yêu cầu này không còn ở trạng thái chờ xác nhận.');b.status='CONFIRMED';notify(b.user,'Lượt đặt '+nm(b)+' đã được xác nhận.');save();render();toast('Đã xác nhận.')},
 rej:v=>M(`<h3>Từ chối yêu cầu</h3><label>Lý do từ chối</label><textarea id=rs rows=3></textarea><div class=err id=me></div><div class=ac><button class="btn o" data-a=x>Đóng</button><button class="btn d" data-a=drj data-v=${v}>Từ chối</button></div>`),
 drj:v=>{const r=$('#rs').value.trim();if(!r)return $('#me').textContent='Bắt buộc nhập lý do từ chối.';const b=DB.bk.find(b=>b.id==v);b.status='REJECTED';b.reason=r;notify(b.user,'Lượt đặt '+nm(b)+' bị từ chối: '+r);save();M('');render();toast('Đã từ chối yêu cầu.')},
 att:v=>{const[id,s]=v.split('|'),b=DB.bk.find(b=>b.id==id);b.status=s;
  if(s=='NO_SHOW'){const mo=b.date.slice(0,7),n=DB.bk.filter(x=>x.user==b.user&&x.status=='NO_SHOW'&&x.date.startsWith(mo)).length;if(n>=DB.cfg.miss){const d=new Date();d.setDate(d.getDate()+14);userO(b.user).until=d.toISOString();notify(b.user,'Bạn vắng mặt '+n+' lần trong tháng nên bị khóa đặt sân 14 ngày.');toast('Người dùng vắng mặt '+n+' lần: khóa đặt sân 14 ngày.')}}save();render()},
 ec:v=>{const c=+v?courtO(+v):{name:'',sport:1,loc:'',cap:10};M(`<h3>${+v?'Sửa sân':'Thêm sân'}</h3><label>Tên sân</label><input id=cn value="${esc(c.name)}"><label>Loại hình</label>${sel('cs',DB.sports.map(s=>[s.id,s.name]),c.sport)}<label>Vị trí</label><input id=cl2 value="${esc(c.loc)}"><label>Sức chứa</label><input id=cp type=number min=1 value=${c.cap}><div class=err id=me></div><div class=ac><button class="btn o" data-a=x>Đóng</button><button class=btn data-a=sc data-v=${v}>Lưu</button></div>`)},
 sc:v=>{const n=$('#cn').value.trim(),p=+$('#cp').value;if(!n||!(p>0))return $('#me').textContent='Vui lòng nhập tên sân và sức chứa hợp lệ.';const o={name:n,sport:+$('#cs').value,loc:$('#cl2').value.trim(),cap:p};if(+v)Object.assign(courtO(+v),o);else DB.courts.push({id:DB.nid++,on:1,...o});save();M('');render()},
 tc:v=>{const c=courtO(+v);c.on=c.on?0:1;save();render()},ts:v=>{const s=sportO(+v);s.on=s.on?0:1;save();render()},
 as:()=>{const n=$('#ns').value.trim();if(!n||DB.sports.some(s=>s.name.toLowerCase()==n.toLowerCase()))return toast('Tên loại hình trống hoặc đã tồn tại.');DB.sports.push({id:DB.nid++,name:n,icon:'🏅',on:1});save();render()},
 tsl:v=>{const s=slotO(+v);s.on=s.on?0:1;save();render()},
 asl:()=>{const a=$('#s1').value,b=$('#s2').value;if(!a||!b||b<=a)return toast('Giờ kết thúc phải sau giờ bắt đầu.');if(DB.slots.some(s=>s.on&&a<s.e&&b>s.s))return toast('Khung giờ bị chồng lấn với khung giờ đã có.');DB.slots.push({id:DB.nid++,s:a,e:b,on:1});DB.slots.sort((x,y)=>x.s.localeCompare(y.s));save();render()},
 am:()=>{const c=+$('#mc').value,d=$('#md').value,s=+$('#ms').value,r=$('#mr').value.trim();if(!d||!r)return $('#me').textContent='Vui lòng nhập ngày và lý do bảo trì.';
  const hit=DB.bk.filter(b=>b.court==c&&b.date==d&&(!s||b.slot==s)&&act(b));hit.forEach(b=>{b.status='CANCELLED';b.reason='Sân bảo trì: '+r;notify(b.user,'Lượt đặt '+nm(b)+' bị hủy do sân bảo trì: '+r)});
  DB.maint.push({id:DB.nid++,court:c,date:d,slot:s,reason:r});save();render();toast('Đã khóa bảo trì'+(hit.length?', hủy '+hit.length+' lượt bị ảnh hưởng và thông báo cho người đặt.':'.'))},
 dm:v=>{DB.maint=DB.maint.filter(m=>m.id!=v);save();render()},
 lk:v=>{const u=userO(+v),lk=u.locked||(u.until&&new Date(u.until)>NOW());u.locked=0;u.until='';if(!lk)u.locked=1;save();$('#ul').innerHTML=ulist()},
 rp:v=>{userO(+v).pw='User@12345';save();toast('Đã đặt lại mật khẩu về User@12345.')},
 csv:()=>{const t='Người dùng,Sân,Ngày,Khung giờ,Trạng thái,Ghi chú\n'+hl().map(b=>[userO(b.user).name,courtO(b.court).name,b.date,slotO(b.slot).s+'-'+slotO(b.slot).e,ST[b.status][0],b.reason].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');M(`<h3>Xuất báo cáo CSV</h3><p class=mu style="margin:0 0 8px">Sao chép nội dung dưới đây và dán vào tệp .csv.</p><textarea id=cv rows=10 readonly>${esc(t)}</textarea><div class=ac><button class="btn o" data-a=x>Đóng</button><button class=btn data-a=cp>Sao chép</button></div>`)},
 cp:()=>{const t=$('#cv');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Đã sao chép.')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){e.preventDefault();A[t.dataset.a](t.dataset.v,t)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){S.q=t.value;if($('#cl'))$('#cl').innerHTML=courtCards();else $('#ul').innerHTML=ulist()}
 else if(t.id=='hq'){S.hq=t.value;S.pg=1;$('#hl').innerHTML=htab(hl())}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.c){const n=Math.max(1,+t.value||1);DB.cfg[t.dataset.c]=n;t.value=n;save();toast('Đã lưu cấu hình.');return}
 const f={fa:'a',fb:'b',fs:'s',ft:'t'};if(f[t.id]){S.f=S.f||{};S.f[f[t.id]]=t.value;S.pg=1;render()}
 else if(t.id=='fc'||t.id=='fd'){S[t.id]=t.value;render()}else if(t.id=='hs'||t.id=='hc'){S[t.id]=t.value;S.pg=1;render()}});
sweep();setInterval(()=>{sweep()},60000);render();
</script></body></html>
